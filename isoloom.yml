# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# SaidaJaula Monster Fit (secDevLabs, by Globo.com) as an Isoloom spec: a Flask gym site whose
# session cookie is a forgeable JSON document, an Identification and Authentication Failure.
# Vendored unchanged from the app folder owasp-top10-2021-apps/a7/saidajaula-monster of
# secDevLabs (build/app/app/, its db/ in build/db/app/), built by an overlay of upstream's
# Dockerfile, with its MariaDB machine. `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-saidajaula-monster

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.107.0/24, internet: false}

machines:
  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/mysql}
    ports:
      mariadb:
        port: 3306
    app:
      build: build/db
  app:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 10002
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/app

checks:
  - name: the home page answers
    http: http://app:10002/
    wait: 180
  - name: the session cookie carries the permission level in clear
    script: checks/session.sh
    wait: 60

message: |
  SaidaJaula Monster Fit answers at {{ machines.app.ports.web.url }}.
  Register, log in, and decode the cookie you get. /admin is for admins only.
